# One command starts the database and the API:
#   cp .env.example .env     (then edit .env)
#   docker compose up -d --build
#
# The API listens on port 8000 over plain HTTP. Put a reverse proxy in front of
# it that terminates HTTPS (Caddy is the easiest, see README) - the app and the
# Africa's Talking callback must use https://.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salama}
      POSTGRES_USER: ${POSTGRES_USER:-salama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # only the reverse proxy on this machine can reach it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
